# Loaded in nginx's http context by /etc/nginx/conf.d/*.conf.
limit_req_zone $binary_remote_addr zone=proxygh_rate:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=proxygh_conn:10m;

# Log only the normalized path so release signatures do not enter logs.
log_format proxygh '$remote_addr - $remote_user [$time_local] '
                   '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                   'request_time=$request_time upstream_time=$upstream_response_time';
