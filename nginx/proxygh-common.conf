# Shared by every fixed GitHub upstream route.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $proxy_host;

# Basic Auth protects this proxy. Never disclose its credentials to GitHub.
proxy_set_header Authorization "";
proxy_set_header Proxy-Authorization "";
proxy_set_header Cookie "";

proxy_ssl_server_name on;
proxy_ssl_name $proxy_host;
proxy_ssl_verify on;
proxy_ssl_verify_depth 3;
proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

# Stream requests and responses. No proxy cache or temporary response files.
proxy_request_buffering off;
proxy_buffering off;
proxy_max_temp_file_size 0;
# GitHub Release redirects carry long signed Location headers.
proxy_buffer_size 32k;
proxy_buffers 8 32k;

proxy_connect_timeout 15s;
proxy_send_timeout 300s;
proxy_read_timeout 300s;
send_timeout 300s;
